    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(C)));
    try{ if(document.getElementById('rem')&&document.getElementById('rem').checked) localStorage.setItem('lrp_pw',pw); }catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    if(!quiet) err.textContent=crypto.subtle?'Wrong password.':'This browser cannot open the page.';
    try{ if(quiet) localStorage.removeItem('lrp_pw'); }catch(e){}
    return false;
  }
}
