const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=id=>document.getElementById(id);
const want=new URLSearchParams(location.search).get('lang');
let key=null;
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  await crypto.subtle.decrypt({name:'AES-GCM',iv:u(PAGES.en.I)},k,u(PAGES.en.C));
  return k;
}
async function show(l){
  try{localStorage.setItem('lrp_lang',l);}catch(e){}
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(PAGES[l].I)},key,u(PAGES[l].C)));
  try{ if(want!==l) history.replaceState(null,'',location.pathname+'?lang='+l); }catch(e){}
  document.open();document.write(html);document.close();
}
function chooser(){
  $('f').hidden=true;$('pick').hidden=false;
  let last=null;try{last=localStorage.getItem('lrp_lang');}catch(e){}
  document.querySelectorAll('.langs button').forEach(b=>{if(b.dataset.l===last)b.classList.add('last');b.addEventListener('click',()=>show(b.dataset.l));});
  const f=document.querySelector('.langs button.last')||document.querySelector('.langs button');f.focus();
}
async function go(pw,quiet){
  try{
    key=await unlock(pw);
    try{ sessionStorage.setItem('lrp_pw',pw); if($('rem').checked) localStorage.setItem('lrp_pw',pw); }catch(e){}
    if(want==='en'||want==='it') show(want); else chooser();
  }catch(e){
    if(!quiet) $('err').textContent=crypto.subtle?'Password errata · Wrong password':'Questo browser non può aprire la pagina · This browser cannot open the page';
    else $('err').textContent='';
    try{ if(quiet){localStorage.removeItem('lrp_pw');sessionStorage.removeItem('lrp_pw');} }catch(e){}
  }
}
$('f').addEventListener('submit',e=>{e.preventDefault();$('err').textContent='Apertura… · Opening…';go($('pw').value,false);});
let saved=null;try{saved=sessionStorage.getItem('lrp_pw')||localStorage.getItem('lrp_pw');}catch(e){}
if(saved){$('err').textContent='Apertura… · Opening…';go(saved,true);}
})();
