<style>
:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d1d1b;--muted:#6b6a66;--line:#e3e1db;--bad:#b3261e}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}

label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:10px}label input{width:auto}

async function open_(pw,quiet){
  const err=document.getElementById('err');
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},key,u(C)));
    try{ if(document.getElementById('rem')&&document.getElementById('rem').checked) localStorage.setItem('lrp_pw',pw); }catch(e){}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    if(!quiet) err.textContent=crypto.subtle?'Password errata.':'Questo browser non può aprire la pagina.';

    return false;
  }
}
